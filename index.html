<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06040A">
<meta name="description" content="Entrenamiento diario para porteros sin entrenador de porteros.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portero Diario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Portero Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Saira+Extra+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: app de una columna (máx. 560 px) sobre negro. Cabecera con degradado negro → morado, tarjetas de superficie
   violeta oscura, dorado solo para lo conseguido. Barra de pestañas fija abajo. Tema único oscuro, a petición. */
:root{
  color-scheme:dark;
  --black:#06040A; --bg:#0B0712; --bg-2:#110A1C; --surface:#170F26; --surface-2:#211634; --line:#2E2246; --line-2:#45335F;
  --purple:#6A2FC2; --purple-hi:#8E55EA; --purple-deep:#3B176F; --lav:#CBB6F4; --text:#F3EEFA; --muted:#AA9DC3; --faint:#7D7097;
  --gold:#D9B65E; --gold-soft:#33290F;
  --ok:#5BD098; --ok-soft:#12301F; --warn:#F2B451; --warn-soft:#382A0F; --bad:#F27D70; --bad-soft:#381614;
  --fig:#EEE7F8; --fig-far:#7A6B97; --ball:#F6F2FB; --ball-line:#0B0712; --tennis:#D7E34B; --tennis-line:#8E9622; --band:#F08A5D; --wall:#1D1430; --wall-2:#281C3F;
  --t-fuerza:#EC8A70; --t-tecnica:#A274FF; --t-reaccion:#62C6EA; --t-activacion:#5BD098; --t-recuperacion:#8A9AC2; --t-base:#CBB6F4; --t-equipo:#F2A15E; --t-partido:#D9B65E; --t-descanso:#5A4C75; --t-especial:#E36BD0;
  --f-display:"Saira Extra Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--black)}
body{color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--lav)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(6,4,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.mark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top .mono{white-space:nowrap}
.mark i{display:inline-block;width:18px;height:18px;border-radius:5px;background:linear-gradient(160deg,#000 10%,var(--purple) 90%);border:1px solid var(--gold)}
.top .mono{font-size:12px;color:var(--muted)}

/* Cabecera */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--black) 0%,#150A26 52%,var(--purple-deep) 100%)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(ellipse 13px 9px at 50% 100%,rgba(217,182,94,.07) 46%,transparent 49%);background-size:22px 15px}
.hero .pad{position:relative;padding-block:22px 22px;display:grid;gap:14px}
.hello{font-size:15px;color:var(--lav)}
.hero h1{font-size:clamp(40px,11vw,58px);font-weight:800}
.phase{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(203,182,244,.35);color:var(--lav)}
.pill.gold{border-color:var(--gold);color:var(--gold)}

/* Tarjetas */
.sec{padding-block:18px 4px;display:grid;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.today{background:linear-gradient(160deg,rgba(142,85,234,.22),rgba(23,15,38,.9) 55%);border:1px solid var(--line-2);border-radius:20px;padding:18px;display:grid;gap:14px}
.ttype{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c,var(--lav))}
.today h3{font-family:var(--f-display);font-size:34px;font-weight:800;text-transform:uppercase;line-height:.95}
.today .sub{color:var(--muted);font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:13px;background:rgba(6,4,10,.45);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;gap:6px;align-items:center}
.fact b{font-family:var(--f-mono);font-weight:700}
.intens{display:inline-flex;gap:3px}
.intens i{width:6px;height:12px;border-radius:2px;background:var(--line-2)}
.intens i.on{background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-size:16px;text-decoration:none;
  background:linear-gradient(135deg,var(--purple-hi),var(--purple));color:#fff;box-shadow:0 8px 24px rgba(106,47,194,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line-2);box-shadow:none;color:var(--text);font-weight:700}
.btn.gold{background:linear-gradient(135deg,#E8CB7A,var(--gold));color:#1A1206;box-shadow:0 8px 24px rgba(217,182,94,.25)}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn.full{width:100%}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl{display:grid;gap:6px}
.ctrl > span{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:rgba(142,85,234,.22);border-color:var(--purple-hi);color:var(--text)}
.done-badge{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;color:var(--gold);font-weight:700}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:grid;justify-items:center;gap:4px;cursor:pointer;min-width:0}
.wd .l{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wd .n{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1}
.wd .dot{width:9px;height:9px}
.wd.today-d{border-color:var(--purple-hi);background:var(--surface-2)}
.wd.done{border-color:var(--gold)}
.wd.done .n{color:var(--gold)}
.wd .s{font-size:9.5px;color:var(--faint);letter-spacing:.02em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}
.tip{border-left:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.tip p{font-size:15.5px}
.tip .src{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.note{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px}
.note.info{color:var(--lav);background:rgba(142,85,234,.12)}

/* Sesión */
.back{background:none;border:0;color:var(--lav);font-weight:700;cursor:pointer;padding:12px 0;font-size:15px}
.block{display:grid;gap:8px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:8px}
.block-h h3{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.block-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.item.ok{border-color:var(--gold)}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.item-top h4{font-size:16.5px;font-weight:700;line-height:1.3}
.item-top .dose{font-family:var(--f-mono);font-size:13px;color:var(--lav);margin-top:3px;display:block}
.item-top .more{font-size:12.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.pair{background:rgba(242,161,94,.14);color:var(--t-equipo)}
.tag.cat{background:rgba(142,85,234,.16);color:var(--lav)}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.set{width:38px;height:38px;border-radius:50%;border:2px solid var(--line-2);background:transparent;color:var(--muted);font-family:var(--f-mono);font-weight:700;font-size:13px;cursor:pointer}
.set[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1A1206}
.tbtn{border:0;border-radius:999px;background:var(--purple);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13.5px;padding:0 14px;min-height:38px;cursor:pointer;font-variant-numeric:tabular-nums}
.tbtn.run{background:var(--text);color:var(--bg)}
.tbtn.rest{background:var(--surface-2);color:var(--lav);border:1px solid var(--line-2)}
.sticky-act{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;padding-block:10px;background:linear-gradient(180deg,transparent,var(--bg) 35%)}

/* Hoja de detalle y superposiciones */
.over{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,2,6,.72)}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-bottom:0;border-radius:22px 22px 0 0;
  padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line-2);justify-self:center}
.sheet h2{font-family:var(--f-display);font-size:32px;font-weight:800;text-transform:uppercase;line-height:.98}
.sheet h3{font-size:13px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.sheet ul li::marker{color:var(--purple-hi)}
.anim{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;justify-content:center;padding:6px}
.anim svg{width:100%;max-width:320px;height:auto;max-height:240px;display:block}
.yt{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;color:var(--text);justify-self:start}
.full-over{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.full-in{max-width:560px;margin:0 auto;padding-block:12px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;min-height:100%}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.g-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--purple-hi),var(--gold))}
.g-name{font-family:var(--f-display);font-size:38px;font-weight:800;text-transform:uppercase;line-height:.95}
.g-dose{font-family:var(--f-mono);font-size:18px;color:var(--gold)}
.g-timer{font-family:var(--f-mono);font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.g-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.rpe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpe button{min-height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono);font-weight:700;cursor:pointer}
.rpe button.on{background:var(--purple);border-color:var(--purple-hi)}
textarea,input[type=text],input[type=search],input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;color:var(--text);font:inherit;padding:12px 14px}
textarea{min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--gold);color:#1A1206;font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}

/* Test inicial */
.ob{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,var(--black) 0%,#12091F 55%,#24103F 100%);padding-top:env(safe-area-inset-top,0px)}
.ob-in{max-width:560px;margin:0 auto;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px))}
.ob-bar{display:flex;gap:3px}
.ob-bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob-bar i.on{background:var(--purple-hi)}
.ob-bar i.cur{background:var(--gold)}
.ob-body{display:grid;align-content:start;gap:16px;padding-block:22px}
.ob-body h2{font-family:var(--f-display);font-size:clamp(34px,9vw,46px);font-weight:800;text-transform:uppercase;line-height:.95}
.ob-body .s{color:var(--muted);font-size:15.5px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:12px;align-items:center;text-align:left;border:1px solid var(--line-2);background:rgba(23,15,38,.75);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:56px}
.opt b{font-size:16.5px;font-weight:700;display:block}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:14px;color:#1A1206}
.opt.multi .ck{border-radius:8px}
.opt.on{border-color:var(--purple-hi);background:rgba(142,85,234,.2)}
.opt.on .ck{background:var(--gold);border-color:var(--gold)}
.opt.on .ck::after{content:"✓";font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayb{aspect-ratio:1/1.15;border-radius:14px;border:1px solid var(--line-2);background:rgba(23,15,38,.75);display:grid;place-items:center;cursor:pointer;font-family:var(--f-display);font-size:24px;font-weight:800;padding:0}
.dayb small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);text-transform:none}
.dayb.on{background:var(--purple);border-color:var(--purple-hi)}
.dayb.on small{color:var(--lav)}
.ob-act{display:grid;grid-template-columns:auto 1fr;gap:10px;padding-top:8px}
.intro-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.intro-list li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15px;color:var(--lav)}
.intro-list li b{font-family:var(--f-display);font-size:28px;color:var(--gold);line-height:1}
.gen{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.gen li{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px;opacity:.35;transition:opacity .4s}
.gen li.on{opacity:1;color:var(--text)}
.gen li.on::before{content:"✓";color:var(--gold);font-weight:800}
.gen li::before{content:"·";width:14px;display:inline-block}
.plan-list{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pl .d{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--muted)}
.pl b{font-size:15px}
.pl small{display:block;color:var(--muted);font-size:12.5px}
.pl .m{font-family:var(--f-mono);font-size:12px;color:var(--lav)}

/* Plan */
.phases{display:flex;gap:3px}
.phases i{flex:1;height:26px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-style:normal;color:rgba(255,255,255,.75)}
.ph-base{background:#3B2465}.ph-des{background:#5A2FA0}.ph-esp{background:#7B46D6}.ph-desc{background:#2A2238}.ph-man{background:#2A2238}
.phases i.cur{outline:2px solid var(--gold);outline-offset:1px;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:18px}
.wnav b{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase}
.why{display:grid;gap:8px}
.why div{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;font-size:14.5px}
.why div .dot{margin-top:5px}

/* Biblioteca */
.lib-list{display:grid;gap:8px}
.lib{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;width:100%}
.lib b{font-size:15.5px}
.count{font-size:13px;color:var(--muted)}

/* Progreso */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.tests{display:grid;gap:10px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.test-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.test-h b{font-size:16px}
.test-v{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.test-v strong{font-family:var(--f-mono);color:var(--text);font-size:16px}
.test-v .best strong{color:var(--gold)}
.test-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.spark{height:28px}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hrow .mono{font-size:12px;color:var(--muted)}

/* Perfil */
.kv{display:grid;gap:0}
.kv div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.ev{display:grid;gap:10px}
.ev article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.ev h4{font-size:15.5px}
.ev p{font-size:14.5px;color:var(--muted)}
.srcs{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.acc summary{cursor:pointer;font-weight:700}
details.acc[open] summary{margin-bottom:10px}

/* Barra inferior */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs-in{pointer-events:auto;width:100%;max-width:560px;background:rgba(11,7,18,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:9px 2px 10px;color:var(--faint);font-size:11px;font-weight:700}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--text)}
.tab.on svg{stroke:var(--gold)}

/* Figura animada */
.fig line{stroke:var(--fig);stroke-width:4.4;stroke-linecap:round;fill:none}
.fig .far line{stroke:var(--fig-far)}
.fig .head{fill:var(--fig)}
.fig .glove{fill:var(--gold)}
.fig .far .glove{opacity:.6}
.fig .bc{fill:var(--ball);stroke:var(--ball-line);stroke-width:1.6}
.fig .bp{fill:var(--ball-line)}
.fig .tbl{fill:var(--tennis);stroke:var(--tennis-line);stroke-width:.8}
.fig .band{stroke:var(--band);stroke-width:2.6;fill:none}
.fig .db line{stroke:var(--muted);stroke-width:3}
.fig .db circle{fill:var(--muted)}
.fig .floor{stroke:var(--line-2);stroke-width:2}
.fig .wall{fill:var(--wall)}
.fig .wall2{fill:var(--wall-2)}
.fig .edge{stroke:var(--line-2);stroke-width:1.3;fill:none}
.fig .lbl{font-family:var(--f-display);font-weight:800;font-size:16px;fill:var(--gold);letter-spacing:.04em}
/* Desplegables: el texto largo queda plegado; el estado abierto se conserva entre repintados */
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:48px;font-weight:700;font-size:15px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .st{flex:1;min-width:0}
details.fold>summary .sm{font-weight:600;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
details.fold>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.fold[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.fold>.fold-in{padding:0 14px 14px;display:grid;gap:10px;font-size:14.5px}
details.fold.inl{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
details.fold.inl>summary{padding:10px 0;min-height:44px;font-size:14.5px}
details.fold.inl>.fold-in{padding:0 0 6px}
details.fold.warn{border-color:rgba(242,180,81,.4)}
details.fold.warn>summary{color:var(--warn)}
details.fold.bad>summary{color:var(--bad)}
.fold-in>p{color:var(--muted)}
.fold-in ul,.fold-in ol{margin:0;padding-left:18px;display:grid;gap:7px}
.fold-in li::marker{color:var(--purple-hi)}
.steps{display:grid;gap:10px}
.steps div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:14px}
.steps b{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);padding-top:2px;letter-spacing:.02em}
.facts-l{display:grid;gap:10px}
.facts-l div b{display:block;font-size:14.5px}
.facts-l div span{color:var(--muted);font-size:14px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.xchip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.cta-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;border-radius:16px;padding:12px 14px;
  background:linear-gradient(135deg,rgba(227,107,208,.16),rgba(23,15,38,.92) 62%);border:1px solid rgba(227,107,208,.42)}
.cta-row b{display:block;font-size:16px}
.cta-row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.cta-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(227,107,208,.18);color:var(--t-especial)}
.cta-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chev{font-size:24px;line-height:1;color:var(--muted)}
.sp-day{display:grid;gap:10px}
.sp-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob-alt{display:grid;gap:10px;margin-top:4px}
.kv-mini{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion: reduce){.gen li{transition:none}details.fold>summary::after{transition:none}}

function phaseOf(P,w){

function fill(b,ctx){

  var out=[],used=0;

  for(var i=0;i<b.force.length;i++){
    var fe=null;for(var j=0;j<pool.length;j++){if(pool[j].id===b.force[i])fe=pool[j];}
    if(fe&&!ctx.used[fe.id]){add(fe);if(b.forceOne)break;}
  }
  b.cats.forEach(function(c){
    if(used>=budget*0.85||out.length>=b.max)return;
    if(out.some(function(e){return e.cat===c;}))return;
    var cc=pool.filter(function(e){return e.cat===c&&!ctx.used[e.id];});
    if(cc.length)add(pick(cc,ctx));
  });
  var cand=pool.filter(function(e){return !ctx.used[e.id];});
  while(used<budget*0.85&&cand.length&&out.length<b.max){var e=pick(cand,ctx);add(e);cand=cand.filter(function(x){return x!==e;});}

function shortType(t){return {fuerza:'Fuerza',tecnica:'Técnica',reaccion:'Reacción',activacion:'Activa',recuperacion:'Recup.',base:'Base',equipo:'Equipo',partido:'Partido',descanso:'Libre'}[t]||t;}
function weeksStreak(){var p=P(),w=curWeek(),n=0;

function spark(arr,up){var vs=arr.map(function(r){return r.v;}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),W=300,H=28;if(mx===mn){mx=mn+1;}

var T=null,ac=null,wl=null;
function beep(fq,d,v){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();}if(ac.state==='suspended')ac.resume();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=fq;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function awake(on){try{if(on&&navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}if(!on&&wl){wl.release().catch(function(){});wl=null;}}catch(e){}}
function stopTimer(){if(!T)return;clearInterval(T.iv);T=null;awake(false);}
function startTimer(k,id,sec,kind){
  stopTimer();beep(660,0.06,0.05);var end=performance.now()+sec*1000,last=-1;
  T={k:k,id:id,kind:kind,rem:sec,iv:0};awake(true);
  function upd(){if(!T)return;var rem=(end-performance.now())/1000;T.rem=rem;var s=Math.ceil(rem);
    if(s!==last){last=s;if(s<=3&&s>=1)beep(520,0.12);paintTimer();}
    if(rem<=0){beep(880,0.35);setTimeout(function(){beep(880,0.45);},420);try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
      var kk=T.k,ii=T.id,kd=T.kind;stopTimer();
      if(kd==='work'){var it=findItem(kk,ii);if(it){var n=Math.min(setsDone(kk,ii)+1,it.d.sets);setSets(kk,ii,n);}}
      render();if(kd==='rest')toast('A por la siguiente serie');}}
  upd();T.iv=setInterval(upd,200);render();
}
function paintTimer(){if(!T)return;var b=document.getElementById(T.kind==='work'?'tb-'+T.id:'rb-'+T.id);if(b){b.textContent=(T.kind==='work'?'❚❚ ':'Descanso ')+mm(T.rem);b.classList.add('run');}

document.addEventListener('click',function(ev){

    case 'ob-next':obNext();break;
    case 'ob-back':obBack();break;
    case 'ob-opt':obOpt(v);break;
    case 'ob-day':obDay(+v);break;
    case 'ob-finish':U.ob=null;U.view='hoy';render();window.scrollTo(0,0);break;
    case 'ob-start':U.sheet=null;U.guided=null;stopTimer();startOb(false);break;

    case 'sp-edit':startSp(k);break;
    case 'sp-set':{var so=C.spOf(S,k);if(!so)break;var fld=t.getAttribute('data-f');so[fld]=(fld==='doms'||fld==='mins')?+v:v;save();render();break;}
    case 'sp-gear':{var sg=C.spOf(S,k);if(!sg)break;sg.gear=sg.gear||[];var gi=sg.gear.indexOf(v);if(gi>=0)sg.gear.splice(gi,1);else sg.gear.push(v);save();render();break;}
    case 'sp-del':{var sd=C.spOf(S,k);if(!sd)break;spClear(sd.g,today());if(S.day[k])delete S.day[k].sp;save();U.view='hoy';U.open['ses-aj']=false;U.open['hoy-aj']=false;render();window.scrollTo(0,0);toast(P()?'Has vuelto a tu plan':'Rutina borrada');break;}
    case 'tab':U.view=v;U.sheet=null;if(v==='plan')U.planWeek=null;render();window.scrollTo(0,0);break;
    case 'open-ses':U.date=k;U.view='sesion';render();window.scrollTo(0,0);break;
    case 'd-mode':dayO(k).mode=v;save();render();break;
    case 'd-loc':dayO(k).loc=v;save();render();break;
    case 'd-mins':dayO(k).mins=+v;save();render();break;
    case 'd-played':dayO(k).played=v==='1';if(v==='1')delete dayO(k).played;save();render();break;
    case 'sheet':U.sheet={id:v,k:k};renderOver();break;
    case 'sheet-close':U.sheet=null;renderOver();break;
    case 'set':{var i=+t.getAttribute('data-i'),cur=setsDone(k,v);setSets(k,v,i<cur?i:i+1);render();break;}
    case 'set-next':{var it=findItem(k,v);if(it){var n=setsDone(k,v);if(n<it.d.sets){setSets(k,v,n+1);if(n+1<it.d.sets&&it.d.rest)startTimer(k,v,it.d.rest,'rest');}}render();break;}
    case 'timer':{if(T&&T.k===k&&T.id===v){stopTimer();render();break;}var it2=findItem(k,v);if(!it2)break;if(setsDone(k,v)>=it2.d.sets)setSets(k,v,0);startTimer(k,v,it2.d.sec,'work');break;}
    case 'rest':{if(T&&T.k===k&&T.id===v&&T.kind==='rest'){stopTimer();render();break;}startTimer(k,v,+t.getAttribute('data-s')||45,'rest');break;}
    case 'guided':U.guided={k:k,i:firstPending(k)};renderOver();break;
    case 'g-exit':U.guided=null;render();break;
    case 'g-prev':if(U.guided){U.guided.i=Math.max(0,U.guided.i-1);stopTimer();renderOver();var fo=document.querySelector('.full-over');if(fo)fo.scrollTop=0;}break;
    case 'g-next':if(U.guided){U.guided.i++;stopTimer();renderOver();var fo2=document.querySelector('.full-over');if(fo2)fo2.scrollTop=0;}break;
    case 'finish':{var lg=S.log[k]||{};var s=C.buildSession(P(),S,k);U.finish={k:k,rpe:lg.rpe||0,feel:lg.feel||'',mins:lg.mins||s.est,note:lg.note||''};renderOver();break;}
    case 'f-rpe':U.finish.note=noteVal();U.finish.rpe=+v;renderOver();break;
    case 'f-feel':U.finish.note=noteVal();U.finish.feel=v;renderOver();break;
    case 'f-mins':U.finish.note=noteVal();U.finish.mins=+v;renderOver();break;
    case 'f-cancel':U.finish=null;renderOver();break;
    case 'f-save':{var f=U.finish,s2=C.buildSession(P(),S,f.k);S.log[f.k]={type:s2.special&&s2.type!=='partido'?'especial':s2.type,mins:f.mins,rpe:f.rpe,feel:f.feel,note:noteVal().slice(0,200),loc:s2.loc,mode:s2.mode};if(s2.special)S.log[f.k].title=s2.title;save();U.finish=null;U.guided=null;stopTimer();render();toast(f.k===today()?'Sesión guardada. Mañana, más.':'Sesión guardada');break;}
    case 'f-del':delete S.log[U.finish.k];save();U.finish=null;render();break;
    case 'pw':{var cw=Math.max(0,curWeek()),w=(U.planWeek==null?cw:U.planWeek)+(+v);U.planWeek=Math.max(0,Math.min(P().weeks+1,w));render();break;}
    case 'wm':{var w2=U.planWeek==null?Math.max(0,curWeek()):U.planWeek;if(v==='def')delete S.weekMatch[w2];else S.weekMatch[w2]=v==='none'?'none':+v;save();render();break;}
    case 'lf-cat':U.lib.cat=v;render();break;
    case 'lf-mode':U.lib.mode=v;render();break;
    case 'lf-loc':U.lib.loc=v;render();break;
    case 'test-save':{var inp=document.getElementById('tv-'+v),val=parseFloat(String(inp&&inp.value||'').replace(',','.'));if(!isFinite(val)){toast('Escribe un número');break;}S.tests[v]=S.tests[v]||[];S.tests[v].push({d:today(),v:val});save();render();toast('Resultado guardado');break;}
    case 'redo':startOb(true);break;
    case 'newplan':U.confirmNew=true;render();break;
    case 'newplan-no':U.confirmNew=false;render();break;
    case 'newplan-yes':P().start=C.mondayKey(today());P().created=today();S.weekMatch={};U.confirmNew=false;save();U.view='hoy';render();toast('Plan nuevo en marcha');break;
    case 'g-save':{var gu=(document.getElementById('g-url')||{}).value||'',gk=(document.getElementById('g-key')||{}).value||'';gu=gu.trim();gk=gk.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(gu)){toast('La dirección debe acabar en /exec');break;}
      if(gk.length<6){toast('Usa una clave de al menos 6 caracteres');break;}
      G.url=gu;G.key=gk;try{localStorage.setItem(GKEY,JSON.stringify({url:gu,key:gk}));}catch(e){}
      G.status='conectando';render();gPull().then(function(ok){render();toast(ok?'Conectado con Google Sheets':'No se pudo conectar');});break;}
    case 'g-off':G.url='';G.key='';G.status='';try{localStorage.removeItem(GKEY);}catch(e){}render();break;
    case 'del':U.confirmDel=true;render();break;
    case 'del-no':U.confirmDel=false;render();break;
    case 'del-yes':stopTimer();S=blank();save();U.confirmDel=false;U.view='hoy';U.ob=null;render();break;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='libq'){U.lib.q=ev.target.value;libList();}
  if(ev.target.id==='ob-name'&&U.ob){U.ob.a.name=ev.target.value;}
});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d&&d.getAttribute&&d.getAttribute('data-fold'))U.open[d.getAttribute('data-fold')]=d.open;},true);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(U.sheet){U.sheet=null;renderOver();}else if(U.finish){U.finish=null;renderOver();}}if(ev.key==='Enter'&&ev.target.id==='ob-name'){obNext();}});
function noteVal(){var n=document.getElementById('f-note');return n?n.value:(U.finish&&U.finish.note)||'';}
function firstPending(k){var s=C.buildSession(P(),S,k),i=0,r=0,found=false;s.blocks.forEach(function(b){b.items.forEach(function(it){if(!found&&setsDone(k,it.e.id)<it.d.sets){r=i;found=true;}i++;});});return r;}
function obNext(){var o=U.ob;if(o.stage==='intro'){o.stage='q';o.step=0;renderOver();return;}
  var qs=visQ(o.a),q=qs[o.step];if(q&&q.type==='text'){var inp=document.getElementById('ob-name');if(inp)o.a.name=inp.value;}
  if(q&&!qValid(q,o.a))return;
  if(o.step<qs.length-1){o.step++;renderOver();var ob=document.querySelector('.ob');if(ob)ob.scrollTop=0;return;}
  S.profile=buildProfile(o.a);save();
  if(o.editing){U.ob=null;U.view='hoy';render();toast('Plan actualizado');return;}
  o.stage='gen';render();}
function obBack(){var o=U.ob;if(o.step===0){if(o.editing){U.ob=null;render();return;}o.stage='intro';renderOver();return;}o.step--;renderOver();}
function obOpt(v){var o=U.ob,q=visQ(o.a)[o.step];
  var opt=q.opts.filter(function(x){return String(x[0])===v;})[0];if(!opt)return;var val=opt[0];
  if(q.type==='one'){o.a[q.id]=val;renderOver();return;}
  var arr=(o.a[q.id]||[]).slice(),i=arr.indexOf(val);
  if(i>=0)arr.splice(i,1);else{
    if(q.none&&val===q.none)arr=[val];else{if(q.none){var ni=arr.indexOf(q.none);if(ni>=0)arr.splice(ni,1);}if(q.max&&arr.length>=q.max)return;arr.push(val);}}
  o.a[q.id]=arr;renderOver();}
function obDay(d){var o=U.ob,q=visQ(o.a)[o.step],arr=(o.a[q.id]||[]).slice(),i=arr.indexOf(d);if(i>=0)arr.splice(i,1);else arr.push(d);o.a[q.id]=arr.sort();renderOver();}

render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
